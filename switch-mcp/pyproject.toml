[project]
name = "enfocus-switch-mcp"
version = "0.2.0"
description = "MCP server (AI connector) for Enfocus Switch: job tracking, checkpoint routing and plain-language preflight reports."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "cryptography>=42",
    "pypdf>=5",
    "defusedxml>=0.7",
    # Automation web service (`enfocus-switch-mcp service`); also used by the MCP SDK.
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]
# Read-only Pace database access (automation/pace.py).
pace = ["psycopg[binary]>=3.1"]

[project.scripts]
enfocus-switch-mcp = "switch_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switch_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint.isort]
known-first-party = ["switch_mcp", "fake_switch"]
